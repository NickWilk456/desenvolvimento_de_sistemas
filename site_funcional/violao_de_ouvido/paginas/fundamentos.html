<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fundamentos do ouvido musical</title>
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body data-pagina="fundamentos" data-raiz="../">
    <header><h1>Fundamentos do ouvido musical</h1></header>
    <nav id="menu"></nav>
    <main>
      <section class="cartao">
        <h2>Teclado de notas</h2>
        <p>Toque em cada nota e perceba como o som fica mais agudo conforme avança.</p>
        <div id="teclado"></div>
      </section>
      
      <section class="cartao">
        <h2>A segunda nota subiu ou desceu?</h2>
        <p>Toque em Ouvir, escute as duas notas e responda.</p>
        <button class="botao" id="btn-ouvir">▶ Ouvir</button>
        <button class="botao" id="btn-sobe">⬆ Subiu</button>
        <button class="botao" id="btn-desce">⬇ Desceu</button>
        <p id="resultado"></p>
        <p>Pontuação: <span id="placar">0 / 0</span></p>
      </section>
    </main>
    <script src="../js/main.js"></script>
    <script src="../js/exercicios.js"></script>
  </body>
</html>
